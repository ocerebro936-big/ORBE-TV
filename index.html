        var err = (e && e.reason ? (e.reason.message || e.reason.stack || e.reason) : '') + '';
        if (
          err.indexOf('MetaMask') !== -1 ||
          err.indexOf('ethereum') !== -1 ||
          err.indexOf('inpage.js') !== -1 ||
          err.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || e.filename || '')) + '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||

          msg.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1

        }
      }, true);
